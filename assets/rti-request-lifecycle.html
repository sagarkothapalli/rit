<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>RTI Request Lifecycle</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 2480px;
      min-height: 1736px;
      overflow: visible;
      background: #F5F2EB;
      color: #17202D;
      font-family: "Avenir Next", "Helvetica Neue", "Noto Sans", ui-sans-serif, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body { display: flex; flex-direction: column; }
    .toprule {
      height: 4px;
      flex: 0 0 auto;
      background: linear-gradient(90deg, #D97706 0 34%, #FFFFFF 34% 66%, #2F7D3F 66% 100%);
    }
    header {
      height: 132px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 48px 0 52px;
      border-bottom: 1px solid #E4DED3;
      background: #F5F2EB;
    }
    .brand { display: flex; flex-direction: column; gap: 5px; }
    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #D97706;
    }
    h1 {
      font-size: 34px;
      font-weight: 650;
      letter-spacing: -0.03em;
      color: #082F5B;
      line-height: 1;
    }
    .sub { font-size: 14px; color: #4B596A; font-weight: 500; }
    .legend { display: flex; gap: 20px; align-items: center; }
    .leg {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 650;
      color: #4B596A;
    }
    .swatch {
      width: 18px;
      height: 12px;
      border-radius: 3px;
      border: 1px solid rgba(8,47,91,0.12);
    }
    .swatch.time { background: #082F5B; border: 0; border-radius: 8px; width: 22px; }
    .swatch.step { background: #FFFFFF; border: 1.5px solid #082F5B; }
    .swatch.ok { background: #2F7D3F; border: 0; }
    .swatch.bad { background: #B42318; border: 0; }
    .swatch.appeal { background: #0E5C6B; border: 0; }
    .swatch.alt { background: #FFF5E8; border: 1.5px solid #D97706; }
    .diagram { height: 1600px; width: 2480px; flex: 0 0 auto; }
    .diagram svg {
      display: block;
      overflow: visible;
      font-family: "Avenir Next", "Helvetica Neue", "Noto Sans", ui-sans-serif, sans-serif;
    }
  </style>
</head>
